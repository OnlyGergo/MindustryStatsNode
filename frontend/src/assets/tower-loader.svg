          <g id="sweep">
            <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="3.0s" repeatCount="indefinite"/>
            <path fill="#ff6b35" fill-opacity="0.7" d="m 256,256 159.4,42.7 a 165,165 0 0 0 3.1,-71.4 z"/>
